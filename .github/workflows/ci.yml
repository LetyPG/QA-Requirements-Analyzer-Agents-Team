name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint - Unit Tests - Integration Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Build — Python + pip cache ─────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # python-magic requires libmagic1 on Ubuntu runners
      - name: Install system dependency (libmagic1)
        run: sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff

      # ── 3. Lint — Ruff (< 1s) ─────────────────────────────────────────────
      - name: Lint with Ruff for hooks and tests
        run: ruff check hooks/ tests/
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 4. Unit Tests for hooks ───────────────────────────────────────────
      - name: Run Unit Tests for hooks
        run: |
          pytest tests/hooks/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 5. Unit Tests for skills risk evaluator ──────────────────────────────────────────
      - name: Run Unit Tests for skills
        run: |
          pytest tests/skills/test_risk_calculator.py -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}

      # ── 6. Integration Tests for hooks ───────────────────────────────────
      - name: Run Integration Tests for hooks
        run: |
          pytest tests/hooks/test_integration.py \
            -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
